[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3",
    "numpy>=2",
    "python-frontmatter>=1.1",
    "sentence-transformers>=5",
]

[dependency-groups]
dev = [
    "apache-airflow==3.3.2",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 오류
    "W",    # pycodestyle 경고
    "F",    # pyflakes: 안 쓰는 import, 정의 안 된 변수
    "I",    # import 정렬
    "B",    # bugbear: 흔한 버그 패턴
    "UP",   # 최신 파이썬 문법으로 바꾸라는 제안
    "SIM",  # 더 간단하게 쓸 수 있는 코드
    "AIR",  # Airflow 전용 규칙
]

[tool.ruff.format]
quote-style = "double"
